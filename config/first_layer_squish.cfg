# First Layer Squish calibration defaults.
# The Python module must be installed into ~/klipper/klippy/extras first.

[first_layer_squish]
square_count: 9
square_size: 30
layer_height: 0.25
# Ellis' guide recommends at least 120% of nozzle diameter.
# For a 0.4mm nozzle, 0.48mm is 120%.
line_width: 0.48
flow: 1.0
# Solid first-layer infill angle, matching common slicer defaults.
infill_angle: 45
bed_margin: 10
bed_temp: 60
extruder_temp: 200
print_speed: 30
travel_speed: 120
z_speed: 10
retract_length: 0.6
retract_speed: 30
z_hop: 2
max_adjustment: 0.5
# Used by the +/- and ++/-- buttons in native manual-probe dialogs.
ui_fine_step: 0.01
ui_coarse_step: 0.05
apply_method: auto

# Customize this block for your printer. Add QGL/Z_TILT, probe docking,
# BED_MESH_CALIBRATE/PROFILE LOAD, or a PRINT_START-style macro as needed.
start_gcode:
    M140 S{bed_temp}
    M104 S{extruder_temp}
    G28
    M190 S{bed_temp}
    M109 S{extruder_temp}

end_gcode:
    TURN_OFF_HEATERS

# FIRST_LAYER_SQUISH appears in the macro panels in Mainsail, Fluidd, and
# KlipperScreen. While calibration is active, the native manual-probe UI uses
# TESTZ, ACCEPT, and ABORT directly. Parameters accepted by
# FIRST_LAYER_SQUISH include COUNT, SIZE, LAYER_HEIGHT, LINE_WIDTH, FLOW,
# INFILL_ANGLE, FILAMENT_DIAMETER, BED_TEMP, and EXTRUDER_TEMP.
[gcode_macro FIRST_LAYER_SQUISH]
description: Start the interactive first-layer squish calibration
gcode:
    _FIRST_LAYER_SQUISH_START {rawparams}

[gcode_macro SQUISH_SELECT]
description: Select a printed square; use SQUARE=1..9
gcode:
    _FIRST_LAYER_SQUISH_SELECT SQUARE={params.SQUARE|int}
