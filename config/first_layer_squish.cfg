# First Layer Squish calibration defaults.
# The Python module must be installed into ~/klipper/klippy/extras first.

[first_layer_squish]
square_count: 9
square_size: 20
# Each patch is four layers tall. Supported range: 3-20.
layer_count: 4
layer_height: 0.25
# Ellis' guide recommends at least 120% of nozzle diameter.
# For a 0.4mm nozzle, 0.48mm is 120%.
line_width: 0.48
flow: 1.0
# Solid first-layer infill angle, matching common slicer defaults.
infill_angle: 45
bed_margin: 10
print_speed: 30
travel_speed: 120
z_speed: 10
retract_length: 0.6
retract_speed: 30
z_hop: 2
max_adjustment: 0.5
# Used by the +/- and ++/-- buttons in native manual-probe dialogs.
ui_fine_step: 0.01
ui_coarse_step: 0.05
apply_method: auto

# Customize this block for your printer. Add QGL/Z_TILT, probe docking,
# BED_MESH_CALIBRATE/PROFILE LOAD, or a PRINT_START-style macro as needed.
start_gcode:
    M140 S{bed_temp}
    M104 S{hotend_temp}
    G28
    M190 S{bed_temp}
    # chamber_temp is available here for a printer-specific heat-soak macro or
    # TEMPERATURE_WAIT command. It is not used automatically because chamber
    # heater and sensor names are not standardized in Klipper configurations.
    M109 S{hotend_temp}

end_gcode:
    TURN_OFF_HEATERS

# Material defaults. These values are starting points; tune them for the exact
# filament and printer. Profile names are case-insensitive.
[first_layer_squish PLA]
hotend_temp: 210
bed_temp: 60
chamber_temp: 25

[first_layer_squish TPU]
hotend_temp: 225
bed_temp: 50
chamber_temp: 30

[first_layer_squish ABS]
hotend_temp: 250
bed_temp: 110
chamber_temp: 50

# FIRST_LAYER_SQUISH appears in the macro panels in Mainsail, Fluidd, and
# KlipperScreen. While calibration is active, the native manual-probe UI uses
# TESTZ, ACCEPT, and ABORT directly. Parameters accepted by
# FIRST_LAYER_SQUISH include FILAMENT, COUNT, SIZE, LAYERS, LAYER_HEIGHT,
# LINE_WIDTH, FLOW, INFILL_ANGLE, FILAMENT_DIAMETER, BED_TEMP, HOTEND_TEMP,
# and CHAMBER_TEMP.
[gcode_macro FIRST_LAYER_SQUISH]
description: Start the interactive first-layer squish calibration
gcode:
    # Keep this declaration in the conventional params.NAME|default|type form
    # so Mainsail, Fluidd, and KlipperScreen can expose FILAMENT in their UI.
    {% set filament = params.FILAMENT|default("")|string|upper %}
    {% if not filament %}
        {action_raise_error("FILAMENT is required: PLA, TPU, or ABS")}
    {% endif %}
    _FIRST_LAYER_SQUISH_START FILAMENT={filament} {% for parameter in params if parameter != 'FILAMENT' %}{parameter}={params[parameter]} {% endfor %}

[gcode_macro SQUISH_SELECT]
description: Select a printed square; use SQUARE=1..9
gcode:
    _FIRST_LAYER_SQUISH_SELECT SQUARE={params.SQUARE|int}
