# First Layer Squish calibration defaults.
# The Python module must be installed into ~/klipper/klippy/extras first.

[first_layer_squish]
square_count: 9
square_size: 30
layer_height: 0.25
# Ellis' guide recommends at least 120% of nozzle diameter.
# For a 0.4mm nozzle, 0.48mm is 120%.
line_width: 0.48
flow: 1.0
bed_margin: 10
bed_temp: 60
extruder_temp: 200
print_speed: 30
travel_speed: 120
z_speed: 10
retract_length: 0.6
retract_speed: 30
z_hop: 2
max_adjustment: 0.5
apply_method: auto

# Customize this block for your printer. Add QGL/Z_TILT, probe docking,
# BED_MESH_CALIBRATE/PROFILE LOAD, or a PRINT_START-style macro as needed.
start_gcode:
    M140 S{bed_temp}
    M104 S{extruder_temp}
    G28
    M190 S{bed_temp}
    M109 S{extruder_temp}

end_gcode:
    TURN_OFF_HEATERS

# Public wrappers appear in the macro panels in Mainsail, Fluidd, and
# KlipperScreen. Parameters accepted by FIRST_LAYER_SQUISH include COUNT,
# SIZE, LAYER_HEIGHT, LINE_WIDTH, FLOW, FILAMENT_DIAMETER, BED_TEMP, and
# EXTRUDER_TEMP.
[gcode_macro FIRST_LAYER_SQUISH]
description: Start the interactive first-layer squish calibration
gcode:
    _FIRST_LAYER_SQUISH_START {rawparams}

[gcode_macro SQUISH_MORE]
description: Add more squish (lower nozzle); optional Z amount, default 0.01
gcode:
    {% set amount = params.Z|default(0.01)|float|abs %}
    _FIRST_LAYER_SQUISH_ADJUST Z=-{amount}

[gcode_macro SQUISH_LESS]
description: Add less squish (raise nozzle); optional Z amount, default 0.01
gcode:
    {% set amount = params.Z|default(0.01)|float|abs %}
    _FIRST_LAYER_SQUISH_ADJUST Z={amount}

[gcode_macro SQUISH_NEXT]
description: Print the next first-layer square
gcode:
    _FIRST_LAYER_SQUISH_NEXT

[gcode_macro SQUISH_SELECT]
description: Select a printed square; use SQUARE=1..9
gcode:
    _FIRST_LAYER_SQUISH_SELECT SQUARE={params.SQUARE|int}

[gcode_macro SQUISH_ACCEPT]
description: Apply the selected offset and run SAVE_CONFIG
gcode:
    _FIRST_LAYER_SQUISH_ACCEPT

[gcode_macro SQUISH_ABORT]
description: Abort and restore the original Z offset
gcode:
    _FIRST_LAYER_SQUISH_ABORT
